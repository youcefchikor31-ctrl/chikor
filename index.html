<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarra - Hello Kitty Theme</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --kitty-pink: #ff6b81;
            --kitty-blue: #70a1ff;
            --pastel-bg: rgba(255, 255, 255, 0.4);
            --card-border: rgba(255, 255, 255, 0.7);
            --text-dark: #2f3542;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f1f2f6; color: var(--text-dark); font-family: 'Delius', cursive; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        #bgVideo { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -3; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0.15); z-index: -2; }

        #startScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .welcome-title {
            font-family: 'Parisienne', cursive; font-size: 5rem; color: var(--kitty-pink); margin-bottom: 25px;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff; animation: bounce 2s infinite;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .start-btn {
            background: #fff; border: 3px solid var(--kitty-pink); color: var(--kitty-pink); padding: 15px 40px;
            font-size: 1.4rem; font-family: 'Delius', cursive; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.3); transition: all 0.3s ease;
        }
        .start-btn:hover { background: var(--kitty-pink); color: #fff; transform: scale(1.05); }

        #mainUI {
            position: relative; z-index: 10; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
        }
        #mainUI.show { opacity: 1; pointer-events: auto; }

        .main-name {
            font-family: 'Parisienne', cursive; font-size: 4rem; color: var(--kitty-pink);
            position: absolute; top: 10%; text-shadow: 2px 2px 0px #fff;
        }

        .view-container {
            position: absolute; width: 100%; max-width: 380px; padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
            opacity: 0; visibility: hidden; transform: translateY(20px) scale(0.95); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .view-container.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

        .glass-btn {
            width: 100%; background: var(--pastel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--card-border); padding: 22px; border-radius: 30px; color: var(--text-dark);
            font-family: 'Delius', cursive; font-size: 1.4rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); transition: all 0.3s ease; display: flex; justify-content: space-between; align-items: center;
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-5px); border-color: #fff; }
        .glass-btn i { font-size: 1.6rem; color: var(--kitty-pink); }
        .glass-btn:nth-child(2) i { color: var(--kitty-blue); }

        .glass-card {
            background: var(--pastel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 2px solid var(--card-border); border-radius: 30px; padding: 30px; width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center;
        }
        .glass-card h2 { font-size: 2rem; margin-bottom: 25px; color: var(--kitty-pink); text-shadow: 1px 1px 0px #fff; }
        
        .about-content { font-size: 1.1rem; line-height: 1.6; color: var(--text-dark); min-height: 100px; background: rgba(255, 255, 255, 0.4); padding: 15px; border-radius: 15px; }
        
        .social-list { display: flex; flex-direction: column; gap: 15px; }
        .social-item {
            display: flex; align-items: center; gap: 15px; background: #fff; padding: 15px 25px;
            border-radius: 20px; color: var(--text-dark); text-decoration: none; font-weight: bold; font-size: 1.2rem;
            transition: all 0.3s; border: 2px solid transparent; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .social-item:hover { transform: translateX(5px) scale(1.02); border-color: var(--kitty-pink); }
        .social-item i { font-size: 1.8rem; }
        .social-item.ig i { color: #E1306C; }
        .social-item.tk i { color: #000; }
        .social-item.sn i { color: #eebb00; }

        .back-btn {
            margin-top: 25px; width: 100%; padding: 15px; border-radius: 20px; border: none;
            background: var(--kitty-blue); color: #fff; font-family: 'Delius', cursive; font-weight: bold; font-size: 1.2rem;
            cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(112, 161, 255, 0.4); display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .back-btn:hover { background: #5b8deb; transform: scale(1.02); }
    </style>
</head>
<body>

    <video id="bgVideo" playsinline preload="auto">
        <source src="chikor.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div id="startScreen">
        <h1 class="welcome-title">Sarra</h1>
        <button class="start-btn" id="startBtn">Open Gift 🎀</button>
    </div>

    <!-- mainUI will now show immediately after clicking Open Gift -->
    <div id="mainUI">
        <h1 class="main-name">Sarra</h1>

        <div id="menuView" class="view-container active">
            <button class="glass-btn" onclick="switchView('aboutView')">
                About Me <i class="fa-solid fa-star"></i>
            </button>
            <button class="glass-btn" onclick="switchView('socialsView')">
                My Socials <i class="fa-solid fa-heart"></i>
            </button>
        </div>

        <div id="aboutView" class="view-container">
            <div class="glass-card">
                <h2>About Me</h2>
                <div class="about-content"></div>
                <button class="back-btn" onclick="switchView('menuView')"><i class="fa-solid fa-arrow-left"></i> Back</button>
            </div>
        </div>

        <div id="socialsView" class="view-container">
            <div class="glass-card">
                <h2>My Socials</h2>
                <div class="social-list">
                    <a href="#" class="social-item ig"><i class="fa-brands fa-instagram"></i> Instagram</a>
                    <a href="#" class="social-item tk"><i class="fa-brands fa-tiktok"></i> TikTok</a>
                    <a href="#" class="social-item sn"><i class="fa-brands fa-snapchat"></i> Snapchat</a>
                </div>
                <button class="back-btn" onclick="switchView('menuView')"><i class="fa-solid fa-arrow-left"></i> Back</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('bgVideo');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const mainUI = document.getElementById('mainUI');

        startBtn.addEventListener('click', () => {
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.visibility = 'hidden';
            }, 800);

            // Show UI immediately when video starts
            mainUI.classList.add('show');

            video.muted = false;
            video.currentTime = 0;
            video.play().catch(e => console.log("Play error:", e));
        });

        function switchView(viewId) {
            document.querySelectorAll('.view-container').forEach(view => {
                view.classList.remove('active');
            });
            document.getElementById(viewId).classList.add('active');
        }
    </script>
</body>
</html>
